name: Deploy to cPanel

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare production files
        run: |
          # Replace public/index.php with cPanel version pointing to ../afobainofilms/
          cp deploy/cpanel-index.php public/index.php

      - name: Deploy to cPanel via LFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Debug: show what's in public/ before upload
          echo "=== Files in public/ ==="
          ls -la public/

          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ftp:ssl-force yes;
            set ssl:verify-certificate no;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1;
            set mirror:parallel-transfer-count 4;
            open -u ${{ secrets.CPANEL_FTP_USERNAME }},${{ secrets.CPANEL_FTP_PASSWORD }} ${{ secrets.CPANEL_FTP_HOST }};

            # ── 1. Ensure storage & cache directories exist on server ──
            mkdir -p afobainofilms/storage/framework/sessions;
            mkdir -p afobainofilms/storage/framework/views;
            mkdir -p afobainofilms/storage/framework/cache/data;
            mkdir -p afobainofilms/storage/logs;
            mkdir -p afobainofilms/bootstrap/cache;

            # ── 2. Upload app files to ~/afobainofilms/ ──
            mirror --reverse --delete --verbose --ignore-time --no-perms \
              --include-glob .htaccess \
              --exclude-glob .git/ \
              --exclude-glob .git*/** \
              --exclude-glob .github/ \
              --exclude-glob node_modules/ \
              --exclude-glob tests/ \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob storage/ \
              --exclude-glob public/ \
              --exclude-glob deploy/ \
              --exclude-glob sample_img/ \
              --exclude-glob README.md \
              --exclude-glob phpunit.xml \
              --exclude-glob _*.php \
              --exclude-glob *.mp4 \
              ./ ./afobainofilms/;

            # ── 3. Upload public files to ~/public_html/ ──
            mirror --reverse --verbose --ignore-time --no-perms \
              --include-glob .htaccess \
              --exclude-glob .well-known/ \
              --exclude-glob default.php \
              ./public/ ./public_html/;

            # ── 4. Verify upload ──
            echo '=== public_html contents ===';
            ls -la public_html/;

            bye;
          "
